name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    name: Build ${{ matrix.branch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        branch:
          - 1.21.1
          - 1.21.4
          - 1.21.11
          - 26.1

    steps:
      - name: Checkout ${{ matrix.branch }}
        uses: actions/checkout@v4
        with:
          ref: main/${{ matrix.branch }}

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build
        run: ./gradlew build

      - name: Read mod and dependency versions
        id: props
        run: |
          get_prop() { grep "^$1" gradle.properties | cut -d'=' -f2 | tr -d ' '; }

          echo "mod_version=$(get_prop mod_version)"                   >> $GITHUB_OUTPUT
          echo "mc_version=$(get_prop minecraft_version)"              >> $GITHUB_OUTPUT

          FABRIC_API=$(get_prop fabric_api_version | cut -d'+' -f1)
          CLOTH=$(get_prop cloth_config_version)
          MOD_MENU=$(get_prop mod_menu_version)
          FABRIC_KOTLIN=$(get_prop fabric_kotlin_version | cut -d'+' -f1)

          echo "fabric_api_version=$FABRIC_API"       >> $GITHUB_OUTPUT
          echo "cloth_config_version=$CLOTH"          >> $GITHUB_OUTPUT
          echo "mod_menu_version=$MOD_MENU"           >> $GITHUB_OUTPUT
          echo "fabric_kotlin_version=$FABRIC_KOTLIN" >> $GITHUB_OUTPUT

      - name: Rename JAR
        run: |
          mkdir -p release-artifacts
          JAR=$(find build/libs -name "*.jar" ! -name "*-sources*" ! -name "*-dev*" | head -1)
          BASENAME=$(basename "$JAR" .jar)
          cp "$JAR" "release-artifacts/${BASENAME}+MC${{ steps.props.outputs.mc_version }}.jar"

      - name: Publish to Modrinth
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          modrinth-id: V3zKXegt

          files: release-artifacts/*.jar

          version: ${{ steps.props.outputs.mod_version }}+MC${{ steps.props.outputs.mc_version }}
          version-type: release

          loaders: fabric
          game-versions: ${{ steps.props.outputs.mc_version }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: jar-${{ matrix.branch }}
          path: release-artifacts/*.jar
          retention-days: 1

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download all JARs
        uses: actions/download-artifact@v4
        with:
          pattern: jar-*
          merge-multiple: true
          path: release-artifacts

      - name: List artifacts
        run: ls -lh release-artifacts/

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          draft: false
          files: release-artifacts/*.jar
          generate_release_notes: true
